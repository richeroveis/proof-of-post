name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build static export
        env:
          # Public values inlined at build time (NOT secrets): the contract is
          # already deployed on a public dev chain. Base path is the Pages
          # subpath for the project page.
          NEXT_PUBLIC_BASE_PATH: /proof-of-post
          NEXT_PUBLIC_CONTRACT_ADDRESS: "0x61eE31810F804E53b4Eb4A3c876F0504A1fC304b"
          NEXT_PUBLIC_GENLAYER_RPC: https://studio-dev.genlayer.com/api
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
