name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build static export
        env:
          # Public values inlined at build time (NOT secrets): the contract is
          # already deployed on a public dev chain. Base path is the Pages
          # subpath for the project page.
          NEXT_PUBLIC_BASE_PATH: /proof-of-post
          # F7 + withdraw-hardening RuleRegistry instance (2026-10-11), verified
          # end-to-end on studio-dev via e2e/studio_devnet_e2e.mjs (deploy tx
          # 0xfcdf651213c1414bad107cf869477976938e0910227867034b1dfc5aaaf660b6);
          # supersedes the pre-F7 0x405e...b594 and pre-remediation 0x61eE...304b.
          # See docs/onchain-activity.md.
          NEXT_PUBLIC_CONTRACT_ADDRESS: "0x30A9A1D88E8885319a9f5F259D5C416Bd55d149E"
          NEXT_PUBLIC_GENLAYER_RPC: https://studio-dev.genlayer.com/api
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
